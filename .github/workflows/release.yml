# Attaches the Linux release binaries to a GitHub release once it is
# published, then packages the same binaries as a signed container image
# on Docker Hub.

name: release

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          then
            echo "release tag $TAG does not match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      # Full history and tags, so that git describe in the Makefile yields
      # the tag as version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # No module cache, so release binaries never build from a cache
      # written by another workflow run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build
        run: make dist

      # cp fails if make dist did not take the tag as version.
      - name: Package
        run: |
          version=${TAG#v}
          out=$RUNNER_TEMP/release
          mkdir -p "$out"
          for arch in amd64 arm64
          do
            stage=$RUNNER_TEMP/stage-$arch
            mkdir -p "$stage"
            cp "dist/webdavgo-$TAG-linux-$arch" "$stage/webdavgo"
            cp dist/LICENSE dist/THIRD_PARTY_LICENSES "$stage/"
            tar -czf "$out/webdavgo_${version}_linux_$arch.tar.gz" \
              --owner=0 --group=0 --numeric-owner \
              -C "$stage" webdavgo LICENSE THIRD_PARTY_LICENSES
          done
          cd "$out"
          sha256sum -- *.tar.gz > SHA256SUMS

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            "$RUNNER_TEMP"/release/*.tar.gz "$RUNNER_TEMP/release/SHA256SUMS"

  image:
    needs: release
    runs-on: ubuntu-24.04
    environment: dockerhub
    permissions:
      contents: read
      # Keyless cosign signing.
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/webdavgo
    steps:
      # For the Dockerfile and the commit time of the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      # The image packages the binaries the release job uploaded, so that
      # both carry the same bytes.
      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dl=$RUNNER_TEMP/download
          mkdir -p "$dl"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D "$dl" \
            -p 'webdavgo_*_linux_amd64.tar.gz' \
            -p 'webdavgo_*_linux_arm64.tar.gz' \
            -p SHA256SUMS
          (cd "$dl" && sha256sum -c SHA256SUMS)
          ctx=$RUNNER_TEMP/context
          for arch in amd64 arm64
          do
            mkdir -p "$ctx/linux/$arch"
            tar -xzf "$dl/webdavgo_${TAG#v}_linux_$arch.tar.gz" \
              -C "$ctx/linux/$arch" webdavgo
          done
          tar -xzf "$dl/webdavgo_${TAG#v}_linux_amd64.tar.gz" \
            -C "$ctx" LICENSE THIRD_PARTY_LICENSES

      # Every timestamp in the image becomes the commit time of the tag, so
      # a rebuild from the same release yields the same layers.
      - name: Source date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
          flavor: |
            latest=${{ !github.event.release.prerelease }}

      # The labels come from the Dockerfile, not from metadata-action, which
      # would take the license from the repository instead.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/context
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed by digest, so the signature covers exactly the pushed index.
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
