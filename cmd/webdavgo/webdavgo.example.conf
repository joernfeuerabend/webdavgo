# webdavgo configuration: flat "key = value" lines (TOML syntax), "#" starts
# a comment. This one file holds every setting; the database holds runtime
# data only (users, shares, quotas). Every key is optional; the values below
# are the defaults. Unknown keys are rejected at startup. Every value is a
# plain number in one fixed unit: durations in whole seconds, sizes in KB and
# rates in KB/s (decimal: 1 KB = 1000 bytes). Durations written as strings
# (such as "30s") and the old keys webdav_addr/webgui_addr are converted in
# place whenever they appear; plain integers are always read in these units.
#
# Without -config, webdavgo reads /etc/webdavgo/webdavgo.conf. If that file
# (or the one given with -config) does not exist, the server creates it, and
# its directory, from this example with the default values.
# "webdavgo install" writes it from webdavgo.example.conf (only if it does
# not exist yet) with data_dir, require_tls, access_log and server_log set
# for the service. Precedence: command-line flag > this file > default.
#
# The admin UI's Settings page edits every key and saves its changes to this
# file. It rewrites only the line of a changed key, activates a commented-out
# "#key = ..." line if there is no active one, or appends the key at the end;
# comments, blank lines, order and your own edits stay as they are.

# Directory for the database (webdavgo.db) and user files (users/<name>/).
data_dir = "./data"

# Minimum log level: debug, info, warn or error.
log_level = "info"

# Number of recent log records kept in memory for the admin UI's Live Log page.
log_buffer_entries = 2000

# Log files, like nginx's access and error logs. access_log gets the
# per-request lines (message "request"), server_log every other record (errors,
# security events, warnings, startup and shutdown). Both are written by
# default; a missing directory is created. An empty value ("") sends the
# records to stdout instead, e.g. for a development run. Absolute paths; both
# may name the same file. The files are opened with
# mode 0640 and reopened on SIGUSR1 (logrotate). With server_log set, Error
# records are also written to stderr, so the journal shows why a start
# failed. CLI commands (setup-info, reset-totp, ...) never write to them.
# "webdavgo install" sets both to files in /var/log/webdavgo.
# Every line, here as on stdout, is "timestamp level message key=value...":
#   2026-10-27T17:09:01.123+01:00 INFO request method=PROPFIND path=/dav/ client=203.0.113.5 status=207 ...
#   2026-10-27T17:09:02.456+01:00 WARN "webdav auth failed" username=x client=203.0.113.5 ...
#access_log = "/var/log/webdavgo/access.log"
#server_log = "/var/log/webdavgo/webdavgo.log"

# Listeners: a port (1-65535) and a listen address, a host name or IP
# address without port; empty = all interfaces. Also set on the admin UI's
# Settings page, where Apply moves a listener without a restart. The
# certificate request sets webdav_port to 443.
#webdav_port = 8080
#webdav_listen_address = ""
# The admin UI (HTTPS only) is reachable from any network that can reach its
# port; webgui_listen_address = "127.0.0.1" limits it to this host or an SSH
# tunnel.
#webgui_port = 8443
#webgui_listen_address = ""

# Health listener: plain HTTP without authentication, separate from the
# WebDAV and admin listeners; off by default, health_enabled = true starts
# it. GET /livez answers 200 "ok" while the server
# runs; GET /readyz answers 200 "ok" if the data directory is writable and
# the database answers, else 503 with a short reason. Every other path is
# 404. "webdavgo healthcheck" queries /readyz here (a wildcard bind address
# is reached over loopback). health_port must differ from webdav_port and
# webgui_port. Also set on the admin UI's Settings page (Health).
#health_enabled = false
#health_bind = "127.0.0.1"
#health_port = 8082

# Seconds a successful WebDAV/API login is remembered to skip bcrypt; 0 disables.
auth_cache_ttl = 300

# Seconds SIGINT/SIGTERM waits for in-flight requests before cutting them.
shutdown_timeout = 30

# Seconds a client may take to send the request headers.
read_header_timeout = 10

# Seconds an idle keep-alive connection stays open.
idle_timeout = 120

# Maximum request body in KB for every method except PUT.
max_request_body = 1000

# Allow PROPFIND with Depth: infinity (or no Depth header); otherwise 403.
allow_propfind_infinity = false

# Maximum simultaneous connections (count) per listener; further ones wait in the kernel queue.
max_connections = 256

# Maximum simultaneous connections (count) per client (IPv4 address, IPv6
# /64) and listener. Further ones are closed right after accept, before TLS.
max_connections_per_ip = 32

# WebDAV requests without credentials, per client (token bucket): requests
# per second, and bucket size in requests. Beyond that: 429 with Retry-After. Requests with
# credentials never count.
unauth_rate = 20
unauth_burst = 50

# Parallel requests (count) per HTTP/2 connection (Go's default would be 250, which
# would multiply max_connections).
http2_max_concurrent_streams = 32

# ---- Users -----------------------------------------------------------------
# Storage quota of a new user in GB (decimal: 1 GB = 10^9 bytes); 0 =
# unlimited. Existing users keep their quota.
default_quota = 1

# ---- TLS -------------------------------------------------------------------
# Set on the admin UI's Settings page (TLS & domain); Apply with tls_mode
# "acme" runs the certificate request, which sets webdav_port to 443.
#
# "off": plain HTTP, credentials in clear text (development / trusted LAN only).
# "acme": the WebDAV listener serves TLS only, with a certificate from an ACME
# CA obtained via TLS-ALPN-01. External port 443 of `domain` must reach the
# WebDAV listener. The admin listener is HTTPS-only with its own certificate,
# but is for the LAN: never forward it in your router.
#tls_mode = "off"

# With tls_mode = "off": do not start the WebDAV listener on a network
# address (loopback is still allowed). The admin listener runs, so the
# Settings page can turn TLS on. "webdavgo install" sets it.
require_tls = false

# Public DNS name of this server; required with tls_mode = "acme".
#domain = "dav.example.com"

# Contact address for the ACME account (expiry notices from the CA); optional.
#acme_email = "admin@example.com"

# "production" (Let's Encrypt), "staging" (Let's Encrypt staging, untrusted
# certificates, generous rate limits) or an https:// ACME directory URL.
#acme_ca = "production"

# CA of the trial order the certificate request places before the real
# one. Empty: Let's Encrypt staging when acme_ca is "production", none
# otherwise. "none" disables the trial; "staging" or an https:// URL sets it.
acme_trial_ca = ""

# PEM file with extra root certificates trusted for the ACME directory
# connection, e.g. Pebble's roots in tests; optional.
#acme_ca_root = "/path/to/roots.pem"

# ACME account and certificates, and the admin listener's self-signed
# certificate; default "<data_dir>/certs". Back it up with data_dir: a restart
# reuses what is stored here instead of ordering again, and the admin
# certificate keeps its fingerprint.
#cert_dir = "./data/certs"

# ---- Brute-force protection ------------------------------------------------
# Failed logins (WebDAV/API Basic Auth, share tokens, admin login) are
# counted per client: IPv4 address or IPv6 /64.
# Window for counting failures, in seconds.
bruteforce_window = 900
# Failures (count) within the window that start a client lockout (429, no
# password check).
bruteforce_ip_threshold = 10
# First lockout in seconds; each further one doubles, up to the maximum (seconds).
bruteforce_lockout_base = 60
bruteforce_lockout_max = 3600
# Failures (count) for one username (from any clients) within the window
# after which only one password check per interval (seconds) runs for it.
# Never a hard lock.
bruteforce_account_threshold = 20
bruteforce_account_interval = 5
# Size limit (entries) of the client table and of the account table. When
# full, locked clients and throttled accounts are never dropped to make room.
bruteforce_max_entries = 100000

# ---- Slow request bodies ---------------------------------------------------
# Seconds a request body may send nothing before it is aborted.
body_read_idle_timeout = 30
# Minimum average body rate in KB/s, checked once the grace period (seconds)
# is over; slower bodies are aborted. 0 disables the rate check.
body_min_rate = 1
body_min_rate_grace = 60

# ---- Slow responses --------------------------------------------------------
# Seconds a response may go unread by the client before it is cut, so a
# stalled download frees its connection slot.
response_write_idle_timeout = 30
# Minimum average response rate in KB/s, checked once the grace period
# (seconds) is over; slower downloads are cut. 0 disables the rate check.
response_min_rate = 1
response_min_rate_grace = 60
